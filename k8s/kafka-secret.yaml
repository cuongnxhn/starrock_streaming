---
# Kubernetes Secret để lưu Kafka authentication config
# 
# Tạo secret từ file client.properties:
#   kubectl create secret generic kafka-client-config \
#     --from-file=client.properties=./client.properties \
#     --namespace=your-namespace
#
# Hoặc apply file YAML này sau khi encode base64

apiVersion: v1
kind: Secret
metadata:
  name: kafka-client-config
  namespace: default  # Thay bằng namespace của bạn
type: Opaque
data:
  # Content của client.properties được encode base64
  # Để encode: cat client.properties | base64 -w 0
  # 
  # Ví dụ content SASL/PLAIN:
  # security.protocol=SASL_SSL
  # sasl.mechanism=PLAIN
  # sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";
  # ssl.truststore.location=/etc/kafka/secrets/kafka.client.truststore.jks
  # ssl.truststore.password=truststore-password
  
  client.properties: |
    # Paste nội dung đã encode base64 vào đây
    # hoặc dùng kubectl create secret từ file (khuyến khích)

---
# Nếu sử dụng SSL, cần secret cho truststore/keystore
apiVersion: v1
kind: Secret
metadata:
  name: kafka-ssl-certs
  namespace: default
type: Opaque
data:
  # Truststore file (encode base64)
  kafka.client.truststore.jks: |
    # Base64 encoded truststore file
    
  # Keystore file (nếu cần mutual TLS)
  # kafka.client.keystore.jks: |
  #   # Base64 encoded keystore file
