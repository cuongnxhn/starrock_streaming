apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-history-server-config
  namespace: default
data:
  spark-defaults.conf: |
    spark.history.provider=org.apache.spark.deploy.history.FsHistoryProvider
    spark.history.fs.logDirectory=s3a://iceberg/spark-logs
    spark.history.fs.update.interval=10s
    spark.hadoop.fs.s3a.endpoint=<YOUR_S3_ENDPOINT>
    spark.hadoop.fs.s3a.access.key=<YOUR_ACCESS_KEY>
    spark.hadoop.fs.s3a.secret.key=<YOUR_SECRET_KEY>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-history-server
  template:
    metadata:
      labels:
        app: spark-history-server
    spec:
      containers:
      - name: spark-history-server
        image: apache/spark:3.5.0  # Thay bằng version Spark của bạn
        command:
        - /opt/spark/sbin/start-history-server.sh
        ports:
        - containerPort: 18080
          name: web-ui
        env:
        - name: SPARK_NO_DAEMONIZE
          value: "true"
        volumeMounts:
        - name: spark-history-config
          mountPath: /opt/spark/conf/spark-defaults.conf
          subPath: spark-defaults.conf
      volumes:
      - name: spark-history-config
        configMap:
          name: spark-history-server-config
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server-service
  namespace: default
spec:
  type: NodePort
  ports:
  - port: 18080
    targetPort: 18080
    nodePort: 30080
    protocol: TCP
    name: web-ui
  selector:
    app: spark-history-server
